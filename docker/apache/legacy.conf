<VirtualHost *:80>
    # 旧アプリ(legacy RUCARO)専用 vhost。
    # 本番 000-default.conf は DocumentRoot=/public で /back を遮断するが、
    # 旧アプリはリポジトリ直下の index.php / api.php がエントリのため、
    # ここでは DocumentRoot をリポジトリルートにする。
    # 使い捨ての legacy コンテナ(scripts/dev/legacy-app.sh)からのみ使用する。
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    LogLevel warn
</VirtualHost>
